<!DOCTYPE html>
<html>
<head>

<title>Seating Portal</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial,sans-serif;
background:#f3f4f6;
margin:0;
min-height:100vh;
display:flex;
flex-direction:column;
text-align:center;
}

/* HEADER */

.header{
background:#05235c;
padding:14px 20px 18px;
box-shadow:0 4px 12px rgba(0,0,0,.25);
color:white;
}

.header h2,
.header h3,
.header h4{
margin:4px 0;
}

.header h2{
font-size:18px;
font-weight:bold;
}

.header h3{
color:#facc15;
font-size:14px;
}

.header h4{
font-size:12px;
font-weight:normal;
}

/* MAIN */

.main-content{
flex:1;
}

/* CARD */

.card{
background:#fafafa;
color:black;
padding:18px;
border-radius:15px;
width:92%;
max-width:430px;
margin:18px auto;
box-shadow:0 2px 10px rgba(0,0,0,.12);
box-sizing:border-box;
}

/* SHIFT */

.shift-title{
font-size:15px;
font-weight:bold;
margin-bottom:10px;
color:#082f75;
}

.shift-box{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
flex-wrap:wrap;
margin-bottom:14px;
}

.shift-box select{
padding:11px;
border-radius:8px;
border:1px solid #d1d5db;
font-size:14px;
background:white;
cursor:pointer;
min-width:180px;
outline:none;
}

/* SEARCH */

.search-box{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
flex-wrap:wrap;
margin-top:5px;
}

input{
width:68%;
padding:12px;
border-radius:8px;
border:1px solid #d1d5db;
font-size:14px;
outline:none;
text-transform:uppercase;
box-sizing:border-box;
}

button{
padding:12px 20px;
background:#032c7a;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:14px;
font-weight:bold;
}

button:hover{
background:#0a3e9f;
}

button:disabled{
background:#9ca3af;
cursor:not-allowed;
}

/* RESULT */

.result{
text-align:left;
margin-top:18px;
}

.result h2{
font-size:20px;
text-align:center;
margin-bottom:15px;
word-break:break-word;
}

.result p{
margin:7px 0;
font-size:14px;
}

.label{
color:#082f75;
font-weight:bold;
}

.value{
color:black;
}

/* INFO BOX */

.info-box{
margin-top:10px;
border:1px solid #d1d5db;
border-radius:10px;
padding:9px 11px;
background:white;
line-height:1.35;
font-size:13.5px;
}

/* REPORT */

.highlight{
background:#edf2f7;
border:1px solid #d6dde7;
padding:11px;
border-radius:10px;
margin-top:10px;
line-height:1.4;
font-size:14px;
font-weight:600;
}

/* ERROR */

.error{
color:red;
font-weight:bold;
}

/* LOADING */

.loading{
color:#082f75;
font-weight:bold;
}

/* FOOTER */

.footer{
margin-top:auto;
padding:10px;
font-size:12px;
color:#6b7280;
}

/* MOBILE */

@media(max-width:600px){

input{
width:60%;
font-size:14px;
}

button{
width:auto;
font-size:14px;
padding:12px 18px;
}

.result h2{
font-size:18px;
}

.shift-box select{
width:100%;
max-width:250px;
}

}

</style>
</head>

<body>

<div class="main-content">

<div class="header">

<h2>BITS EXAMINATION</h2>

<h3>CANDIDATE SEATING ARRANGEMENT</h3>

<h4>CENTRE : JYOTHY INSTITUTE OF TECHNOLOGY </h4>

<h4>🗓️ Date: 26-06-2026 | 🕘 Shift : Select Below</h4>

</div>


<div class="card">

<!-- SHIFT SELECTION -->

<div class="shift-title">
SELECT YOUR SHIFT
</div>

<div class="shift-box">

<select id="shiftSelect">

<option value="">
-- Select Your Shift --
</option>

<option value="seating1.xlsx">
1st SHIFT 9:00 AM
</option>

<option value="seating2.xlsx">
2nd SHIFT 1:00 PM
</option>

<option value="seating3.xlsx">
3rd SHIFT 4:30 PM
</option>

</select>

</div>


<!-- SEARCH AREA -->

<div class="search-box">

<input
id="idInput"
placeholder="ENTER BITS ID (EX:2024BT78)"
autofocus
disabled>

<button
id="searchButton"
onclick="search()"
disabled>

Search

</button>

</div>


<div id="result" class="result"></div>

</div>

</div>


<div class="footer">

DEVELOPED BY SUDARSAN NB

</div>


<!-- XLSX LIBRARY -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<script>

let data = {};

let selectedFile = "";

let dataLoaded = false;


/* ELEMENTS */

const shiftSelect =
document.getElementById("shiftSelect");

const idInput =
document.getElementById("idInput");

const searchButton =
document.getElementById("searchButton");

const result =
document.getElementById("result");


/* SHIFT SELECTION */

shiftSelect.addEventListener("change", function(){

selectedFile = this.value;

data = {};

dataLoaded = false;

idInput.value = "";

result.innerHTML = "";


/* NO SHIFT SELECTED */

if(!selectedFile){

idInput.disabled = true;

searchButton.disabled = true;

return;

}


/* SHIFT SELECTED */

idInput.disabled = true;

searchButton.disabled = true;

result.innerHTML = `

<p class="loading">
⏳ Loading seating data...
</p>

`;


/* LOAD SELECTED EXCEL */

fetch(selectedFile)

.then(response => {

if(!response.ok){

throw new Error("Excel file not found");

}

return response.arrayBuffer();

})

.then(fileData => {

let workbook =
XLSX.read(fileData, {
type:"array"
});


if(!workbook.SheetNames.length){

throw new Error("No worksheet found");

}


let sheet =
workbook.Sheets[
workbook.SheetNames[0]
];


let json =
XLSX.utils.sheet_to_json(sheet);


if(json.length === 0){

throw new Error("Excel file is empty");

}


/* CLEAR PREVIOUS DATA */

data = {};


/* READ EXCEL DATA */

json.forEach(row => {

if(!row["Candidate ID"])
return;


let id =
row["Candidate ID"]
.toString()
.trim()
.toUpperCase();


data[id] = {

name: row["Candidate Name"],

program: row["Program Name"],

floor: row["Floor"],

block: row["Block"],

lab: row["Lab"],

system: row["System Number"]

};

});


/* CHECK WHETHER DATA WAS LOADED */

if(Object.keys(data).length === 0){

throw new Error("No Candidate ID found");

}


dataLoaded = true;

idInput.disabled = false;

searchButton.disabled = false;

result.innerHTML = `

<p class="loading">
✅ ${getShiftName(selectedFile)} selected. Enter your BITS ID.
</p>

`;

idInput.focus();

})

.catch(error => {

data = {};

dataLoaded = false;

idInput.disabled = true;

searchButton.disabled = true;

result.innerHTML = `

<p class="error">
❌ Unable to load ${getShiftName(selectedFile)} data.
</p>

<p>
Please contact the Help Desk.
</p>

`;

console.error(error);

});

});


/* SHIFT NAME */

function getShiftName(file){

if(file === "seating1.xlsx")
return "1st SHIFT";

if(file === "seating2.xlsx")
return "2nd SHIFT";

if(file === "seating3.xlsx")
return "3rd SHIFT";

return "selected shift";

}


/* SEARCH */

function search(){


/* SHIFT CHECK */

if(!selectedFile){

result.innerHTML = `

<p class="error">
⚠️ Please select your shift first.
</p>

`;

return;

}


/* DATA CHECK */

if(!dataLoaded){

result.innerHTML = `

<p class="loading">
⏳ Seating data is still loading. Please wait.
</p>

`;

return;

}


/* GET ID */

let id =
idInput.value
.trim()
.toUpperCase();


/* EMPTY ID */

if(!id){

result.innerHTML = `

<p class="error">
❌ Please enter Candidate ID.
</p>

`;

idInput.focus();

return;

}


/* FIND STUDENT */

let s = data[id];


/* STUDENT NOT FOUND */

if(!s){

result.innerHTML = `

<p class="error">
❌ Student not found! Please recheck your BITS ID.
</p>

<p>
If data not found 👉 Contact Help Desk:
2nd floor, Lab Computer Lab-2
</p>

`;

return;

}


/* DISPLAY RESULT */

result.innerHTML = `

<h2>${s.name || "-"}</h2>


<div class="info-box">

<p>
<span class="label">📖 Program:</span>
<span class="value">${s.program || "-"}</span>
</p>


<p>
<span class="label">🏢 Floor:</span>
<span class="value">${s.floor || "-"}</span>
</p>


<p>
<span class="label">🏣 Block:</span>
<span class="value">${s.block || "-"}</span>
</p>


<p>
<span class="label">🪟 Lab:</span>
<span class="value">${s.lab || "-"}</span>
</p>


<p>
<span class="label">🖥️ System No:</span>
<span class="value">${s.system || "-"}</span>
</p>

</div>


<div class="highlight">

📍 Report to
<b>${s.floor || "-"}</b> Floor,
<b>${s.block || "-"}</b>,
Lab <b>${s.lab || "-"}</b>,
System <b>${s.system || "-"}</b>

</div>


<div class="info-box">

✅ <b>Mandatory:</b><br>

<B>Please check your shift details before proceeding and take a screenshot.Show the screenshot to the invigilator!</B>

</div>


<div class="info-box">

ℹ️ <b>Note:</b><br>

For any queries please visit
Computer Lab-2, 2nd Floor.

</div>

`;

}


/* ENTER KEY */

idInput.addEventListener(
"keydown",
function(e){

if(e.key === "Enter"){

e.preventDefault();

search();

}

});


</script>

</body>
</html>
